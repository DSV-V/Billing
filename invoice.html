<!DOCTYPE html>
<html lang="pl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Faktura</title>
<link rel="stylesheet" href="css/style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/config.js"></script><script src="js/common.js"></script></head>
<body><script>
initPage('invoice', render);
async function render() {
  const p = params();
  $('content').innerHTML = '<p>Liczę…</p>';
  const { data, error } = await sb.rpc('invoice_preview', { p_client: p.client, p_year: p.year, p_month: p.month });
  if (error) { $('content').innerHTML = '<div class="alert err">Błąd: ' + esc(error.message) + '</div>'; return; }
  const tot = (data || []).find(r => r.pozycja === 'ИТОГО');
  const mr = tot && /курс\s+([\d.]+)/.exec(tot.uwagi || '');
  const rate = mr ? parseFloat(mr[1]) : null;
  const note = tot ? String(tot.uwagi || '').replace('предварительно', 'wstępnie').replace('закрыт', 'zamknięta').replace('курс', 'kurs').replace(' на ', ' z dnia ') : '';
  const rows = (data || []).filter(r => r.pozycja !== 'ИТОГО').map(r => ({ name: r.pozycja, cat: r.kategoria, qty: r.ilosc, price: r.cena_gbp, gbp: r.suma_gbp, eur: r.suma_eur, miss: r.uwagi === 'НЕТ ЦЕНЫ' }));
  const per = await sb.from('periods').select('id').eq('client_id', p.client).eq('year', p.year).eq('month', p.month).maybeSingle();
  if (per.data) {
    const mi = await sb.from('manual_items').select('*').eq('period_id', per.data.id);
    (mi.data || []).forEach(r => { const c = ctx.categories.find(x => x.id === r.category_id);
      rows.push({ name: r.description || '—', cat: c ? c.name : 'transport', qty: r.quantity, price: r.unit_price, gbp: r.amount, eur: r.amount == null || !rate ? null : Math.round(r.amount * rate * 100) / 100, miss: r.unit_price == null }); });
  }
  const missing = rows.filter(r => r.miss);
  let html = '<h1>Faktura wstępna</h1>';
  if (missing.length) html += '<div class="alert err">UWAGA: brak ceny dla pozycji: ' + missing.map(r => esc(r.name)).join(', ') + '. Faktury nie można zamknąć, dopóki ceny nie zostaną uzupełnione.</div>';
  const sums = {}; let allG = 0, allE = 0;
  html += '<div class="grid2">';
  CAT_ORDER.forEach(cat => {
    const list = rows.filter(r => r.cat === cat);
    const g = list.reduce((a, r) => a + Number(r.gbp || 0), 0), e = list.reduce((a, r) => a + Number(r.eur || 0), 0);
    sums[cat] = [g, e]; allG += g; allE += e;
    html += '<div class="card cat-' + cat + '"><h3>' + esc(catName(cat)) + '</h3><table><thead><tr><th>Pozycja</th><th class="num">Ilość</th><th class="num">Cena (GBP)</th><th class="num">Suma (GBP)</th><th class="num">Suma (EUR)</th></tr></thead><tbody>' +
      (list.length ? list.map(r => '<tr><td>' + esc(r.name) + '</td><td class="num">' + (r.qty == null ? '' : r.qty) + '</td><td class="num' + (r.miss ? ' noprice' : '') + '">' + (r.miss ? 'BRAK CENY' : fmt(r.price)) + '</td><td class="num">' + fmt(r.gbp) + '</td><td class="num">' + fmt(r.eur) + '</td></tr>').join('') : '<tr><td colspan="5" style="color:#64748b">Brak pozycji w tej kategorii.</td></tr>') +
      '<tr class="sum"><td colspan="3">Razem — ' + esc(catName(cat)) + '</td><td class="num">' + fmt(g) + '</td><td class="num">' + fmt(e) + '</td></tr></tbody></table></div>';
  });
  html += '</div><div class="card" style="margin-top:16px"><h3>Podsumowanie wszystkich kategorii</h3><div class="stats">' +
    CAT_ORDER.map(c => '<div class="stat s-' + c + '"><small>' + esc(catName(c)) + '</small><b>' + fmt(sums[c][0]) + ' GBP</b><br>' + fmt(sums[c][1]) + ' EUR</div>').join('') +
    '<div class="stat total"><small>RAZEM</small><b>' + fmt(allG) + ' GBP</b><br>' + fmt(allE) + ' EUR</div></div>' +
    (note ? '<p style="color:#64748b;margin:14px 0 0">' + esc(note) + '</p>' : '') + '</div>';
  $('content').innerHTML = html;
}
</script></body></html>
