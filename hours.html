<!DOCTYPE html>
<html lang="pl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Godziny</title>
<link rel="stylesheet" href="css/style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/config.js"></script><script src="js/common.js"></script></head>
<body><script>
initPage('hours', render);
async function render() {
  const p = params(), sid = serviceId(HOURS_SERVICE);
  if (!sid) { $('content').innerHTML = '<div class="alert err">Nie znaleziono usługi „' + HOURS_SERVICE + '”.</div>'; return; }
  const { data } = await sb.from('daily_records').select('*').eq('client_id', p.client).eq('service_id', sid).gte('record_date', p.first).lte('record_date', p.end).order('record_date');
  const total = (data || []).reduce((a, r) => a + Number(r.quantity), 0);
  $('content').innerHTML = '<h1>Godziny dodatkowe</h1><div class="card"><div class="row">' +
    '<div><label>Data</label><input id="hDate" type="date"></div>' +
    '<div><label>Liczba godzin</label><input id="hQty" type="number" min="0" step="0.25" value="0" style="width:110px"></div>' +
    '<button onclick="save()">Zapisz</button></div>' +
    '<table><thead><tr><th>Data</th><th class="num">Godziny</th><th></th></tr></thead><tbody>' +
    (data || []).map(r => '<tr><td>' + r.record_date + '</td><td class="num">' + r.quantity + '</td><td class="num"><button class="sec" onclick="del(' + r.id + ')">Usuń</button></td></tr>').join('') +
    '<tr class="sum"><td>Razem w miesiącu</td><td class="num">' + total + '</td><td></td></tr></tbody></table></div>';
  $('hDate').value = new Date().toISOString().slice(0, 10);
}
async function save() {
  const p = params();
  const { error } = await sb.from('daily_records').upsert({ client_id: p.client, service_id: serviceId(HOURS_SERVICE), record_date: $('hDate').value, zone: '', quantity: parseFloat($('hQty').value) || 0 }, { onConflict: 'client_id,service_id,record_date,zone' });
  if (error) showMsg('Błąd zapisu: ' + error.message, true); else { await render(); showMsg('Zapisano.'); }
}
async function del(id) {
  if (!confirm('Na pewno usunąć wpis?')) return;
  const { error } = await sb.from('daily_records').delete().eq('id', id);
  if (error) showMsg('Błąd: ' + error.message, true); else render();
}
</script></body></html>
