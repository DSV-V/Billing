<!DOCTYPE html>
<html lang="pl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Transport i refaktury</title>
<link rel="stylesheet" href="css/style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/config.js"></script><script src="js/common.js"></script></head>
<body><script>
initPage('items', render);
async function render() {
  const p = params();
  const tf = await sb.from('tariffs').select('service_id').eq('client_id', p.client).eq('calc_method', 'from_register');
  const ids = [...new Set((tf.data || []).map(x => x.service_id))];
  const mp = await sb.from('month_prices').select('service_id,unit_price').eq('client_id', p.client).eq('year', p.year).eq('month', p.month);
  const price = {}; (mp.data || []).forEach(x => price[x.service_id] = x.unit_price);
  let html = '<h1>Transport i refaktury</h1><div class="card"><h3>Ceny refaktur na ten miesiąc</h3><table><thead><tr><th>Pozycja</th><th>Cena jedn. (GBP)</th><th></th></tr></thead><tbody>' +
    ids.map(id => { const s = ctx.services.find(x => x.id === id), v = price[id] == null ? '' : price[id];
      return '<tr><td>' + esc(s ? s.name : id) + '</td><td><input id="mp-' + id + '" type="number" step="0.01" min="0" value="' + v + '" ' + (v === '' ? 'placeholder="BRAK CENY"' : '') + ' style="width:130px"></td><td class="num"><button onclick="saveMp(' + id + ')">Zapisz</button></td></tr>'; }).join('') +
    '</tbody></table></div>';
  const per = await sb.from('periods').select('id').eq('client_id', p.client).eq('year', p.year).eq('month', p.month).maybeSingle();
  html += '<div class="card"><h3>Pozycje ręczne (transport i inne)</h3>';
  if (!per.data) html += '<div class="alert err" style="margin-top:12px">Ten miesiąc nie został jeszcze otwarty. Otwórz stronę „Faktura”, aby go utworzyć.</div></div>';
  else {
    const { data } = await sb.from('manual_items').select('*').eq('period_id', per.data.id).order('id');
    const cats = ctx.categories.filter(c => ['transport', 'refacturing'].includes(c.name));
    html += '<div class="row" style="margin-top:12px"><div><label>Kategoria</label><select id="iCat">' + cats.map(c => '<option value="' + c.id + '">' + esc(catName(c.name)) + '</option>').join('') + '</select></div>' +
      '<div><label>Opis</label><input id="iDesc" style="width:230px"></div><div><label>Ilość</label><input id="iQty" type="number" step="0.01" value="1" style="width:90px"></div>' +
      '<div><label>Cena jedn. (GBP)</label><input id="iPrice" type="number" step="0.01" style="width:120px"></div><button onclick="saveItem(' + per.data.id + ')">Dodaj</button></div>' +
      '<table><thead><tr><th>Kategoria</th><th>Opis</th><th class="num">Ilość</th><th class="num">Cena jedn.</th><th class="num">Suma</th><th></th></tr></thead><tbody>' +
      (data || []).map(r => { const c = ctx.categories.find(x => x.id === r.category_id), np = r.unit_price === null;
        return '<tr><td>' + esc(c ? catName(c.name) : '') + '</td><td>' + esc(r.description) + '</td><td class="num">' + r.quantity + '</td><td class="num' + (np ? ' noprice' : '') + '">' + (np ? 'BRAK CENY' : fmt(r.unit_price)) + '</td><td class="num">' + fmt(r.amount) + '</td><td class="num"><button class="sec" onclick="delItem(' + r.id + ')">Usuń</button></td></tr>'; }).join('') +
      '</tbody></table></div>';
  }
  $('content').innerHTML = html;
}
async function saveMp(sid) {
  const p = params(), v = $('mp-' + sid).value;
  if (v === '') { showMsg('Wpisz cenę. Pozycja bez ceny nie może zostać zapisana.', true); return; }
  const { error } = await sb.from('month_prices').upsert({ client_id: p.client, service_id: sid, year: p.year, month: p.month, unit_price: parseFloat(v) }, { onConflict: 'client_id,service_id,year,month' });
  if (error) showMsg('Błąd zapisu: ' + error.message, true); else { await render(); showMsg('Cena zapisana.'); }
}
async function saveItem(periodId) {
  const p = params(), v = $('iPrice').value;
  if (v === '') { showMsg('Wpisz cenę jednostkową. Pozycja bez ceny nie może zostać zapisana.', true); return; }
  const { error } = await sb.from('manual_items').insert({ client_id: p.client, period_id: periodId, category_id: parseInt($('iCat').value), description: $('iDesc').value, quantity: parseFloat($('iQty').value) || 0, unit_price: parseFloat(v) });
  if (error) showMsg('Błąd zapisu: ' + error.message, true); else { await render(); showMsg('Dodano.'); }
}
async function delItem(id) {
  if (!confirm('Na pewno usunąć pozycję?')) return;
  await sb.from('manual_items').delete().eq('id', id); render();
}
</script></body></html>
